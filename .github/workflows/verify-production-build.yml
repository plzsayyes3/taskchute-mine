name: Verify TaskLiner production build

on:
  push:
    branches:
      - taskliner-migration
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Test access to historical source
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -e
          url="https://api.github.com/repos/plzsayyes3/catch-all-notebook/contents/taskliner/src/main.ts?ref=bcb6a611c9612eb856ea0c1d92854d5a6b2d11aa"
          status="$(curl -sS -o /tmp/source.json -w '%{http_code}' \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "$url")"
          echo "cross_repo_http_status=$status"
          if [ "$status" = "200" ]; then
            jq -r '.content' /tmp/source.json | base64 -d > /tmp/recovered-main.ts
            echo "recovered_source_blob=$(git hash-object /tmp/recovered-main.ts)"
          fi

      - name: Install dependencies
        run: npm install

      - name: Build
        run: npm run build

      - name: Verify production artifact
        shell: bash
        run: |
          expected="1845cebc52313c2217d3f703af4029c51959c456"
          actual="$(git hash-object main.js)"
          echo "expected=$expected"
          echo "actual=$actual"
          if [ "$actual" != "$expected" ]; then
            echo "Production build does not match the currently deployed TaskLiner artifact."
            exit 1
          fi
          echo "Production build matches the deployed TaskLiner artifact."
