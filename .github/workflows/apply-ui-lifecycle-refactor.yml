name: Apply UI lifecycle refactor

on:
  push:
    branches:
      - refactor/ui-lifecycle

permissions:
  contents: write

jobs:
  refactor:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor/ui-lifecycle

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Apply guarded UI lifecycle extraction
        run: python scripts/extract_ui_lifecycle.py

      - name: Install dependencies
        run: npm install

      - name: Regression tests
        run: npm test

      - name: Build plugin
        run: npm run build

      - name: Clean temporary refactor files
        run: rm -f scripts/extract_ui_lifecycle.py .github/workflows/apply-ui-lifecycle-refactor.yml

      - name: Commit UI lifecycle refactor
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No UI lifecycle changes to commit"
            exit 0
          fi
          git commit -m "Extract UI lifecycle registration"
          git push origin HEAD:refactor/ui-lifecycle
