name: Apply Techo service refactor

on:
  push:
    branches:
      - refactor/techo-service

permissions:
  contents: write

jobs:
  refactor:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor/techo-service

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Apply guarded Techo extraction
        run: python scripts/extract_techo_service.py

      - name: Install dependencies
        run: npm install

      - name: Regression tests
        run: npm test

      - name: Build plugin
        run: npm run build

      - name: Clean temporary refactor files
        run: rm -f scripts/extract_techo_service.py .github/workflows/apply-techo-refactor.yml

      - name: Commit Techo service refactor
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No Techo changes to commit"
            exit 0
          fi
          git commit -m "Extract Techo import service"
          git push origin HEAD:refactor/techo-service
