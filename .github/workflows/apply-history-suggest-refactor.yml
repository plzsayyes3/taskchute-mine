name: Apply history suggestion UI refactor

on:
  push:
    branches:
      - refactor/history-suggest-ui

permissions:
  contents: write

jobs:
  refactor:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor/history-suggest-ui

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Apply guarded history suggestion extraction
        run: python scripts/extract_history_suggest_ui.py

      - name: Install dependencies
        run: npm install

      - name: Regression tests
        run: npm test

      - name: Build plugin
        run: npm run build

      - name: Clean temporary refactor files
        run: rm -f scripts/extract_history_suggest_ui.py .github/workflows/apply-history-suggest-refactor.yml

      - name: Commit history suggestion refactor
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No history suggestion changes to commit"
            exit 0
          fi
          git commit -m "Extract history suggestion UI"
          git push origin HEAD:refactor/history-suggest-ui
