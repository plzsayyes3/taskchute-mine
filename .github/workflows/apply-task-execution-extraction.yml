name: Extract task execution service

on:
  push:
    branches:
      - refactor/task-execution-service

permissions:
  contents: write

jobs:
  refactor:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor/task-execution-service
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Extract task execution service
        run: python scripts/extract_task_execution_service.py
      - name: Install dependencies
        run: npm install
      - name: Regression tests
        run: npm test
      - name: Typecheck
        run: npm run typecheck
      - name: Build plugin
        run: npm run build
      - name: Clean temporary extraction files
        run: |
          rm -f scripts/extract_task_execution_service.py
          rm -f .github/workflows/apply-task-execution-extraction.yml
      - name: Commit task execution extraction
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Extract task execution service" || exit 0
          git push
