name: Apply settings tab refactor

on:
  push:
    branches:
      - refactor/settings-tab

permissions:
  contents: write

jobs:
  refactor:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor/settings-tab

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Apply guarded settings tab extraction
        run: python scripts/extract_settings_tab.py

      - name: Install dependencies
        run: npm install

      - name: TaskLine regression tests
        run: npm run test:task-line

      - name: Build plugin
        run: npm run build

      - name: Clean temporary refactor files
        run: rm -f scripts/extract_settings_tab.py .settings-tab-trigger

      - name: Commit settings tab refactor
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/main.ts src/settings-tab.ts scripts/extract_settings_tab.py .settings-tab-trigger || true
          git add -u
          if git diff --cached --quiet; then
            echo "No settings tab changes to commit"
            exit 0
          fi
          git commit -m "Extract settings tab UI"
          git push origin HEAD:refactor/settings-tab
