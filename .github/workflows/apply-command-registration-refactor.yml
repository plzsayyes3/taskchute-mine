name: Apply command registration refactor

on:
  push:
    branches:
      - refactor/command-registration

permissions:
  contents: write

jobs:
  refactor:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor/command-registration

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Apply guarded command extraction
        run: python scripts/extract_command_registration.py

      - name: Install dependencies
        run: npm install

      - name: Regression tests
        run: npm test

      - name: Build plugin
        run: npm run build

      - name: Clean temporary refactor files
        run: rm -f scripts/extract_command_registration.py .github/workflows/apply-command-registration-refactor.yml

      - name: Commit command registration refactor
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No command registration changes to commit"
            exit 0
          fi
          git commit -m "Extract command registration module"
          git push origin HEAD:refactor/command-registration
