name: Apply settings refactor

on:
  push:
    branches:
      - refactor/settings

permissions:
  contents: write

jobs:
  refactor:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor/settings

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Apply guarded settings extraction
        run: python scripts/refactor_settings_defaults.py

      - name: Install dependencies
        run: npm install

      - name: TaskLine regression tests
        run: npm run test:task-line

      - name: Build plugin
        run: npm run build

      - name: Clean temporary refactor files
        run: |
          rm scripts/refactor_settings_defaults.py
          rm .github/workflows/apply-settings-refactor.yml
          rm .settings-refactor-trigger

      - name: Commit settings refactor
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Extract settings defaults and type" || exit 0
          git push origin HEAD:refactor/settings
