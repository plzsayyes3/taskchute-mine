name: Apply TaskLine refactor

on:
  push:
    branches:
      - refactor/task-line-core

permissions:
  contents: write

jobs:
  refactor:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor/task-line-core

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Apply guarded extraction
        run: python scripts/refactor_task_line.py

      - name: Install dependencies
        run: npm install

      - name: Run TaskLine regression tests
        run: npm run test:task-line

      - name: Build plugin
        run: npm run build

      - name: Commit refactor
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/main.ts src/core/task-line.ts tests/task-line.test.cjs package.json .gitignore
          if git diff --cached --quiet; then
            echo "No refactor changes to commit"
            exit 0
          fi
          git commit -m "Extract TaskLine core with regression tests"
          git push origin HEAD:refactor/task-line-core
