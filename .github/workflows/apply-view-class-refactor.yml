name: Apply view class refactor

on:
  push:
    branches:
      - refactor/view-classes

permissions:
  contents: write

jobs:
  refactor:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor/view-classes
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Apply guarded view extraction
        run: python scripts/extract_view_classes.py
      - name: Install dependencies
        run: npm install
      - name: Regression tests
        run: npm test
      - name: Build plugin
        run: npm run build
      - name: Clean temporary refactor files
        if: success()
        run: rm -f scripts/extract_view_classes.py .github/workflows/apply-view-class-refactor.yml
      - name: Commit view class refactor
        if: success()
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Extract calendar and scroll view classes"
          git push origin HEAD:refactor/view-classes
